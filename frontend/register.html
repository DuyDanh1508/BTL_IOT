<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT - Đăng ký</title>
    <link rel="stylesheet" href="../css/register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="register-page">
    <div class="register-container">
        <div class="register-logo">
            <i class="fa-solid fa-microchip"></i> IOT
        </div>
        <h1 class="register-title">Đăng ký</h1>
        <p class="register-subtitle">Tạo tài khoản mới để sử dụng hệ thống</p>

        <div class="message-box" id="message-box"></div>

        <form id="register-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="fullname">Họ và tên</label>
                <input type="text" id="fullname" placeholder="Nhập họ và tên..." required>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu (tối thiểu 6 ký tự)..." minlength="6" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Nhập lại mật khẩu</label>
                <input type="password" id="confirm-password" placeholder="Nhập lại mật khẩu..." minlength="6" required>
            </div>

            <button type="submit" class="btn-register">
                <i class="fa-solid fa-user-plus"></i> Đăng ký
            </button>
        </form>

        <div class="register-footer">
            Đã có tài khoản?
            <a href="login.html">Đăng nhập</a>
        </div>
    </div>

    <script src="../js/register.js"></script>
</body>
</html>
